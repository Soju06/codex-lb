{{- if .Values.networkPolicy.enabled }}
{{- $httpPort := .Values.service.port | default 2455 }}
{{- $externalDatabasePort := 5432 }}
{{- $usesDirectDatabaseUrl := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) (not .Values.auth.existingSecret) (not .Values.externalSecrets.enabled) .Values.externalDatabase.url }}
{{- if $usesDirectDatabaseUrl }}
{{- $parsedUrl := urlParse .Values.externalDatabase.url }}
{{- $urlPort := regexFind ":[0-9]+$" $parsedUrl.host | trimPrefix ":" }}
{{- $queryPort := regexFind "(^|&)port=[0-9]+(&|$)" $parsedUrl.query }}
{{- if $queryPort }}
{{- $urlPort = regexFind "[0-9]+" $queryPort }}
{{- else }}
{{- $queryHost := regexFind "(?i)(^|&)host=[^&]*(%3a|:)[0-9]+(&|$)" $parsedUrl.query }}
{{- if $queryHost }}
{{- $urlPort = regexFind "[0-9]+(&|$)" $queryHost | trimSuffix "&" }}
{{- end }}
{{- end }}
{{- if $urlPort }}
{{- $externalDatabasePort = atoi $urlPort }}
{{- if or (lt $externalDatabasePort 1) (gt $externalDatabasePort 65535) }}
{{- fail "externalDatabase.url port must be between 1 and 65535" }}
{{- end }}
{{- end }}
{{- else }}
{{- $externalDatabasePort = .Values.externalDatabase.port | default 5432 }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "codex-lb.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "codex-lb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "codex-lb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingressNSMatchLabels }}
    # Allow HTTP traffic from ingress controller
    - ports:
        - port: {{ $httpPort }}
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNSMatchLabels | nindent 14 }}
    {{- end }}
    # Allow internal bridge handoff and peer-to-peer health traffic between codex-lb pods
    - ports:
        - port: {{ $httpPort }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "codex-lb.selectorLabels" . | nindent 14 }}
    # Allow metrics scraping from Prometheus
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      from:
        - namespaceSelector: {}
    # Helm test pod
    - from:
        - podSelector:
            matchLabels:
              helm.sh/chart: {{ include "codex-lb.chart" . }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
    {{- else }}
    - ports:
        - port: {{ $externalDatabasePort }}
          protocol: TCP
    {{- end }}
    # HTTPS for OpenAI API
    - ports:
        - port: 443
          protocol: TCP
    # Allow pod-to-pod bridge owner handoff egress
    - to:
        - podSelector:
            matchLabels:
              {{- include "codex-lb.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ $httpPort }}
          protocol: TCP
    # OTLP gRPC tracing (port 4317)
    {{- if .Values.tracing.enabled }}
    - ports:
        - port: 4317
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
