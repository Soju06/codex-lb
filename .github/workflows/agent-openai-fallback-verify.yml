name: agent-openai-fallback-verify

on:
  push:
    branches:
      - agent/openai-api-fallback

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Apply final patch and verify
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/fallback-verify.log
          run() {
            echo "> $*" | tee -a /tmp/fallback-verify.log
            "$@" 2>&1 | tee -a /tmp/fallback-verify.log
            return ${PIPESTATUS[0]}
          }

          status=0
          run uv run python scripts/agent_finalize_openai_fallback.py || status=$?
          if [ "$status" -eq 0 ]; then
            run uv run ruff format \
              app/db/models.py \
              app/modules/model_sources/repository.py \
              tests/unit/test_subscription_fallback.py \
              tests/integration/test_subscription_fallback_routes.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run uv run ruff check --fix \
              app/db/models.py \
              app/modules/model_sources/repository.py \
              tests/unit/test_subscription_fallback.py \
              tests/integration/test_subscription_fallback_routes.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then run git diff --check || status=$?; fi
          if [ "$status" -eq 0 ]; then run uv run pytest -q tests/unit/test_subscription_fallback.py || status=$?; fi
          if [ "$status" -eq 0 ]; then run uv run pytest -q tests/integration/test_subscription_fallback_routes.py || status=$?; fi
          if [ "$status" -eq 0 ]; then
            run uv run pytest -q tests/integration/test_model_source_routing.py -k responses || status=$?
          fi
          if [ "$status" -eq 0 ]; then run make lint || status=$?; fi
          if [ "$status" -eq 0 ]; then run make typecheck || status=$?; fi
          if [ "$status" -eq 0 ]; then run make frontend-install || status=$?; fi
          if [ "$status" -eq 0 ]; then run bash -lc 'cd frontend && bun run typecheck' || status=$?; fi
          if [ "$status" -eq 0 ]; then
            run bash -lc 'cd frontend && bun run test -- src/i18n/index.test.ts src/features/model-sources/components/model-source-edit-dialog.test.tsx src/features/model-sources/schemas.test.ts' || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run npx -y @fission-ai/openspec@latest validate openai-api-fallback --strict || status=$?
          fi

          git config user.name 'Oleh Formaniuk'
          git config user.email 'zjklee@gmail.com'

          if [ "$status" -ne 0 ]; then
            cp /tmp/fallback-verify.log agent-openai-fallback-verify.log
            git add agent-openai-fallback-verify.log
            git commit -m 'chore: capture fallback verification failure' || true
            git push || true
            exit "$status"
          fi

          rm -f .github/workflows/agent-openai-fallback-verify.yml
          rm -f scripts/agent_finalize_openai_fallback.py
          rm -f agent-openai-fallback-verify.log
          git add -A
          git commit -m 'test(proxy): harden subscription fallback invariants'
          git push
