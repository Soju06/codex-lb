name: agent-openai-fallback-postpr

on:
  push:
    branches: [agent/openai-api-fallback]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Verify final regressions
        run: |
          set -euo pipefail
          uv run ruff check tests/integration/test_subscription_fallback_config.py
          uv run ruff format --check tests/integration/test_subscription_fallback_config.py
          uv run pytest -q tests/integration/test_subscription_fallback_config.py
          make frontend-install
          cd frontend
          bun run typecheck
          bun run test -- src/features/model-sources/components/model-source-fallback-fields.test.tsx
      - name: Remove verification workflow
        run: |
          rm .github/workflows/agent-openai-fallback-postpr.yml
          git config user.name 'Oleh Formaniuk'
          git config user.email 'zjklee@gmail.com'
          git add -A
          git commit -m 'chore: remove fallback post-PR verifier'
          git push
