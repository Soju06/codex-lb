global
    log stdout format raw local0
    stats socket ipv4@127.0.0.1:9999 level admin
    server-state-file /var/lib/haproxy/server-state

defaults
    log global
    mode http
    option httplog
    option http-keep-alive
    timeout connect 10s
    timeout client 65m
    timeout server 65m
    timeout tunnel 65m
    load-server-state-from-file global

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 1s
    hold other 1s
    hold refused 1s
    hold timeout 1s

frontend codex_lb
    bind :2455
    default_backend codex_lb_slots

backend codex_lb_slots
    balance leastconn
    option forwardfor
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto http
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server blue server-blue:2455 id 1 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server green server-green:2455 id 2 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server surge server-surge:2455 id 3 weight 0 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server amber server-amber:2455 id 4 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
