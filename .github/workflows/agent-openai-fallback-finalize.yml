name: agent-openai-fallback-finalize

on:
  push:
    branches: [agent/openai-api-fallback]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Patch final review gaps
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Enforce the one-fallback invariant at the database layer as well as
          # in the service transaction, so concurrent writers cannot leave two
          # active fallback rows across replicas.
          replace_once(
              "app/db/models.py",
              'class ModelSource(Base):\n    __tablename__ = "model_sources"\n\n',
              '''class ModelSource(Base):
              __tablename__ = "model_sources"
              __table_args__ = (
                  Index(
                      "uq_model_sources_subscription_fallback",
                      "is_subscription_fallback",
                      unique=True,
                      postgresql_where=text("is_subscription_fallback IS TRUE"),
                      sqlite_where=text("is_subscription_fallback = 1"),
                  ),
              )

              '''.replace("              ", ""),
          )

          replace_once(
              "app/db/alembic/versions/20260807_163500_add_model_source_subscription_fallback.py",
              '    op.add_column("model_sources", sa.Column("fallback_model", sa.String(length=255), nullable=True))\n',
              '''    op.add_column("model_sources", sa.Column("fallback_model", sa.String(length=255), nullable=True))
              op.create_index(
                  "uq_model_sources_subscription_fallback",
                  "model_sources",
                  ["is_subscription_fallback"],
                  unique=True,
                  postgresql_where=sa.text("is_subscription_fallback IS TRUE"),
                  sqlite_where=sa.text("is_subscription_fallback = 1"),
              )
              '''.replace("              ", ""),
          )
          replace_once(
              "app/db/alembic/versions/20260807_163500_add_model_source_subscription_fallback.py",
              'def downgrade() -> None:\n    op.drop_column("model_sources", "fallback_model")\n',
              'def downgrade() -> None:\n    op.drop_index("uq_model_sources_subscription_fallback", table_name="model_sources")\n    op.drop_column("model_sources", "fallback_model")\n',
          )

          # Route new dashboard copy through the existing i18n layer.
          replace_once(
              "frontend/src/features/model-sources/components/model-source-form-fields.tsx",
              '''          Use as subscription fallback
              </label>
              <p className="text-xs text-muted-foreground">
                Used only after all eligible ChatGPT accounts report upstream usage exhaustion.
              </p>
              {draft.isSubscriptionFallback ? (
                <div className="space-y-1">
                  <label className="text-xs text-muted-foreground">Fallback model override (optional)</label>
                  <Input
                    value={draft.fallbackModel}
                    onChange={(event) => updateDraft({ fallbackModel: event.target.value })}
                    placeholder="Leave blank to preserve the requested model"
              '''.replace("              ", ""),
              '''          {t("modelSources.fields.subscriptionFallback")}
              </label>
              <p className="text-xs text-muted-foreground">
                {t("modelSources.fields.subscriptionFallbackDescription")}
              </p>
              {draft.isSubscriptionFallback ? (
                <div className="space-y-1">
                  <label className="text-xs text-muted-foreground">
                    {t("modelSources.fields.fallbackModelOverride")}
                  </label>
                  <Input
                    value={draft.fallbackModel}
                    onChange={(event) => updateDraft({ fallbackModel: event.target.value })}
                    placeholder={t("modelSources.fields.fallbackModelPlaceholder")}
              '''.replace("              ", ""),
          )

          locale_values = {
              "en.json": {
                  "modelSources.fields.subscriptionFallback": "Use as subscription fallback",
                  "modelSources.fields.subscriptionFallbackDescription": "Used only after all eligible ChatGPT accounts report upstream usage exhaustion.",
                  "modelSources.fields.fallbackModelOverride": "Fallback model override (optional)",
                  "modelSources.fields.fallbackModelPlaceholder": "Leave blank to preserve the requested model",
              },
              "ko.json": {
                  "modelSources.fields.subscriptionFallback": "구독 폴백으로 사용",
                  "modelSources.fields.subscriptionFallbackDescription": "적격한 모든 ChatGPT 계정이 업스트림 사용량 한도에 도달한 경우에만 사용됩니다.",
                  "modelSources.fields.fallbackModelOverride": "폴백 모델 재정의(선택 사항)",
                  "modelSources.fields.fallbackModelPlaceholder": "요청된 모델을 유지하려면 비워 두세요",
              },
              "zh-CN.json": {
                  "modelSources.fields.subscriptionFallback": "用作订阅回退",
                  "modelSources.fields.subscriptionFallbackDescription": "仅当所有符合条件的 ChatGPT 账户都达到上游用量限制时使用。",
                  "modelSources.fields.fallbackModelOverride": "回退模型覆盖（可选）",
                  "modelSources.fields.fallbackModelPlaceholder": "留空以保留请求的模型",
              },
          }
          for filename, additions in locale_values.items():
              path = Path("frontend/src/i18n/locales") / filename
              data = json.loads(path.read_text())
              for key, value in additions.items():
                  if key in data:
                      raise SystemExit(f"locale key already exists: {filename}:{key}")
                  data[key] = value
              path.write_text(json.dumps(dict(sorted(data.items())), ensure_ascii=False, indent=2) + "\n")

          # Add route-level regressions at the same seam used by the existing
          # aggregate quota tests. These prove both public Responses paths hand
          # off only on usage_limit_reached, and that the source path owns the
          # already-created reservation.
          test_path = Path("tests/integration/test_proxy_responses.py")
          test_text = test_path.read_text()
          helper_anchor = '''def _install_usage_limited_selection(monkeypatch, *, resets_at: int | None = 1_700_003_600) -> None:
              async def fake_select_account(*_args, **_kwargs):
                  return proxy_module.AccountSelection(
                      account=None,
                      error_message="Rate limit exceeded. Try again in 300s",
                      error_code="usage_limit_reached",
                      resets_at=resets_at,
                  )

              monkeypatch.setattr(
                  "app.modules.proxy.load_balancer.LoadBalancer.select_account",
                  fake_select_account,
              )


              '''.replace("              ", "")
          helper_replacement = helper_anchor + '''async def _create_subscription_fallback_source(async_client, *, model: str = "gpt-5.4") -> str:
              response = await async_client.post(
                  "/api/model-sources/",
                  json={
                      "name": "subscription-fallback",
                      "baseUrl": "http://127.0.0.1:9/v1",
                      "apiKey": "fallback-secret",
                      "supportsChatCompletions": False,
                      "supportsResponses": True,
                      "isSubscriptionFallback": True,
                      "models": [
                          {
                              "model": model,
                              "displayName": model,
                              "supportsStreaming": True,
                              "supportsTools": True,
                          }
                      ],
                  },
              )
              assert response.status_code == 200
              return response.json()["id"]


              '''.replace("              ", "")
          if test_text.count(helper_anchor) != 1:
              raise SystemExit("usage-limit helper anchor missing")
          test_text = test_text.replace(helper_anchor, helper_replacement, 1)

          insert_anchor = '''@pytest.mark.asyncio
              async def test_v1_responses_pool_usage_exhaustion_omits_unknown_reset(async_client, monkeypatch):
              '''.replace("              ", "")
          new_tests = r'''@pytest.mark.parametrize(
              ("path", "stream"),
              [
                  ("/backend-api/codex/responses", True),
                  ("/v1/responses", False),
              ],
          )
          @pytest.mark.asyncio
          async def test_responses_pool_usage_exhaustion_routes_to_model_source_fallback(
              async_client,
              monkeypatch: pytest.MonkeyPatch,
              path: str,
              stream: bool,
          ) -> None:
              _install_usage_limited_selection(monkeypatch)
              source_id = await _create_subscription_fallback_source(async_client)
              captured: dict[str, object] = {}

              async def fake_source_response(
                  request,
                  payload,
                  *,
                  source,
                  api_key,
                  rate_limit_headers,
                  reservation_override=None,
                  reuse_reservation=False,
              ):
                  del request, api_key, rate_limit_headers
                  captured.update(
                      source_id=source.id,
                      model=payload.model,
                      stream=payload.stream,
                      reservation=reservation_override,
                      reuse_reservation=reuse_reservation,
                  )
                  if reservation_override is not None:
                      await proxy_api_module._release_reservation(reservation_override)
                  return proxy_api_module.JSONResponse(
                      content={
                          "id": "resp_subscription_fallback",
                          "object": "response",
                          "status": "completed",
                          "output": [],
                      }
                  )

              monkeypatch.setattr(proxy_api_module, "_source_responses_response", fake_source_response)

              response = await async_client.post(
                  path,
                  json={"model": "gpt-5.4", "instructions": "hi", "input": "hello", "stream": stream},
              )

              assert response.status_code == 200
              assert response.json()["id"] == "resp_subscription_fallback"
              assert captured["source_id"] == source_id
              assert captured["model"] == "gpt-5.4"
              assert captured["stream"] is stream
              assert captured["reuse_reservation"] is True


          @pytest.mark.asyncio
          async def test_responses_fallback_reuses_limited_api_key_reservation(async_client, monkeypatch) -> None:
              _install_usage_limited_selection(monkeypatch)
              await _create_subscription_fallback_source(async_client)
              settings_response = await async_client.put("/api/settings", json={"apiKeyAuthEnabled": True})
              assert settings_response.status_code == 200
              key_response = await async_client.post(
                  "/api/api-keys/",
                  json={
                      "name": "fallback-reservation-key",
                      "limits": [
                          {"limitType": "total_tokens", "limitWindow": "weekly", "maxValue": 1000}
                      ],
                  },
              )
              assert key_response.status_code == 200
              api_key = key_response.json()["key"]

              original_enforce = proxy_api_module._enforce_request_limits
              enforce_calls = 0
              captured_reservation = None

              async def counting_enforce(*args, **kwargs):
                  nonlocal enforce_calls
                  enforce_calls += 1
                  return await original_enforce(*args, **kwargs)

              async def fake_source_response(
                  request,
                  payload,
                  *,
                  source,
                  api_key,
                  rate_limit_headers,
                  reservation_override=None,
                  reuse_reservation=False,
              ):
                  nonlocal captured_reservation
                  del request, payload, source, api_key, rate_limit_headers
                  assert reuse_reservation is True
                  assert reservation_override is not None
                  captured_reservation = reservation_override
                  await proxy_api_module._release_reservation(reservation_override)
                  return proxy_api_module.JSONResponse(
                      content={
                          "id": "resp_subscription_fallback_limited",
                          "object": "response",
                          "status": "completed",
                          "output": [],
                      }
                  )

              monkeypatch.setattr(proxy_api_module, "_enforce_request_limits", counting_enforce)
              monkeypatch.setattr(proxy_api_module, "_source_responses_response", fake_source_response)

              response = await async_client.post(
                  "/v1/responses",
                  headers={"Authorization": f"Bearer {api_key}"},
                  json={"model": "gpt-5.4", "input": "hello", "stream": False},
              )

              assert response.status_code == 200
              assert captured_reservation is not None
              assert enforce_calls == 1


          @pytest.mark.asyncio
          async def test_non_quota_selection_failure_does_not_contact_subscription_fallback(
              async_client,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              async def fake_select_account(*_args, **_kwargs):
                  return proxy_module.AccountSelection(
                      account=None,
                      error_message="No account capacity",
                      error_code="account_response_create_cap",
                  )

              monkeypatch.setattr(
                  "app.modules.proxy.load_balancer.LoadBalancer.select_account",
                  fake_select_account,
              )
              await _create_subscription_fallback_source(async_client)

              async def fail_if_called(*_args, **_kwargs):
                  raise AssertionError("subscription fallback must not be contacted for local capacity")

              monkeypatch.setattr(proxy_api_module, "_source_responses_response", fail_if_called)
              response = await async_client.post(
                  "/v1/responses",
                  json={"model": "gpt-5.4", "input": "hello", "stream": True},
              )
              assert response.status_code != 200 or response.headers.get("content-type", "").startswith(
                  "text/event-stream"
              )


          '''.replace("          ", "")
          if test_text.count(insert_anchor) != 1:
              raise SystemExit("integration test insertion anchor missing")
          test_text = test_text.replace(insert_anchor, new_tests + insert_anchor, 1)
          test_path.write_text(test_text)
          PY

      - name: Format and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format app tests/unit/test_subscription_fallback.py tests/integration/test_proxy_responses.py
          uv run ruff check --fix app/db/alembic/versions/20260807_163500_add_model_source_subscription_fallback.py app/db/models.py tests/integration/test_proxy_responses.py
          git diff --check
          make lint
          make typecheck

      - name: Backend fallback tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/unit/test_subscription_fallback.py
          uv run pytest -q tests/integration/test_proxy_responses.py -k 'pool_usage_exhaustion or subscription_fallback or fallback_reuses or non_quota_selection_failure'
          uv run pytest -q tests/integration/test_model_source_routing.py -k 'responses'

      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          make frontend-install
          cd frontend
          bun run typecheck
          bun run test -- src/i18n/index.test.ts src/features/model-sources/components/model-source-edit-dialog.test.tsx src/features/model-sources/schemas.test.ts

      - name: OpenSpec strict validation
        shell: bash
        run: |
          set -euo pipefail
          npx -y @fission-ai/openspec@latest validate openai-api-fallback --strict

      - name: Commit verified changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-openai-fallback-finalize.yml
          git config user.name 'Oleh Formaniuk'
          git config user.email 'zjklee@gmail.com'
          git add -A
          git commit -m 'test(proxy): harden subscription fallback invariants'
          git push
