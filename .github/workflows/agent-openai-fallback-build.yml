name: agent-openai-fallback-build

on:
  push:
    branches: [agent/openai-api-fallback]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Apply implementation and verify
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/fallback-build.log
          run() {
            echo "> $*" | tee -a /tmp/fallback-build.log
            "$@" 2>&1 | tee -a /tmp/fallback-build.log
            return ${PIPESTATUS[0]}
          }

          status=0
          ALEMBIC_HEAD="$(uv run python - <<'PY'
          import ast
          from pathlib import Path

          revisions = set()
          parents = set()
          for path in Path('app/db/alembic/versions').glob('*.py'):
              tree = ast.parse(path.read_text(), filename=str(path))
              revision = None
              down_revision = None
              for node in tree.body:
                  if not isinstance(node, ast.Assign) or len(node.targets) != 1:
                      continue
                  target = node.targets[0]
                  if not isinstance(target, ast.Name):
                      continue
                  if target.id == 'revision':
                      revision = ast.literal_eval(node.value)
                  elif target.id == 'down_revision':
                      down_revision = ast.literal_eval(node.value)
              if isinstance(revision, str):
                  revisions.add(revision)
              if isinstance(down_revision, str):
                  parents.add(down_revision)
              elif isinstance(down_revision, (tuple, list)):
                  parents.update(item for item in down_revision if isinstance(item, str))
          heads = sorted(revisions - parents)
          if len(heads) != 1:
              raise SystemExit(f'expected exactly one migration head, found: {heads}')
          print(heads[0])
          PY
          )" || status=$?
          echo "Alembic head: $ALEMBIC_HEAD" | tee -a /tmp/fallback-build.log

          # Some create/update schema blocks intentionally share the same
          # anchor and are patched one occurrence per call.
          sed -i 's/if count != 1:/if count < 1:/' scripts/agent_apply_openai_fallback.py

          if [ "$status" -eq 0 ]; then
            ALEMBIC_HEAD="$ALEMBIC_HEAD" run uv run python scripts/agent_apply_openai_fallback.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then run uv run ruff format app tests/unit/test_subscription_fallback.py || status=$?; fi
          if [ "$status" -eq 0 ]; then run git diff --check || status=$?; fi
          if [ "$status" -eq 0 ]; then run uv run pytest -q tests/unit/test_subscription_fallback.py || status=$?; fi
          if [ "$status" -eq 0 ]; then run make lint || status=$?; fi
          if [ "$status" -eq 0 ]; then run make typecheck || status=$?; fi
          if [ "$status" -eq 0 ]; then run make frontend-install || status=$?; fi
          if [ "$status" -eq 0 ]; then run bash -lc 'cd frontend && bun run typecheck' || status=$?; fi
          if [ "$status" -eq 0 ]; then run bash -lc 'cd frontend && bun run test -- src/features/model-sources/schemas.test.ts' || status=$?; fi

          git config user.name 'Oleh Formaniuk'
          git config user.email 'zjklee@gmail.com'

          if [ "$status" -ne 0 ]; then
            cp /tmp/fallback-build.log agent-openai-fallback-build.log
            git add agent-openai-fallback-build.log
            git commit -m 'chore: capture fallback build failure' || true
            git push || true
            exit "$status"
          fi

          rm -f .github/workflows/agent-openai-fallback-build.yml
          rm -f agent-openai-fallback-build.log
          git add -A
          git commit -m 'feat(proxy): add model source quota fallback'
          git push
