SPECIFICATION RegressionSpec

CONSTANTS
  Replicas = {r1}
  Accounts = {a1}
  Turns = {t1}
  Weakening = "none"

INVARIANTS
  TypeInvariant
  Inv1AnchorCurrent
  Inv2DeadlineOrdering
  Inv3ReservationSettledExactlyOnce
  Inv4FreshSnapshots
  Inv5SingleOwnerCAS
  Inv6TerminalIsolation
  Inv7GateAccounting
  Inv8ShutdownDrain
