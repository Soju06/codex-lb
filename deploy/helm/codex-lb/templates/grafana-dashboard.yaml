{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard" (include "codex-lb.fullname" . | trunc 53 | trimSuffix "-") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "codex-lb.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.metrics.grafanaDashboard.folder | quote }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{- $filename := base $path }}
  {{- if hasKey $.Values.metrics.grafanaDashboard.titles $filename }}
  {{- $dashboard := $.Files.Get $path | fromJson }}
  {{- $_ := set $dashboard "title" (index $.Values.metrics.grafanaDashboard.titles $filename) }}
  {{ $filename }}: |-
    {{ $dashboard | toPrettyJson | nindent 4 }}
  {{- else }}
  {{ $filename }}: |-
    {{ $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
