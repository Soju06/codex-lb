[advisories]
version = 2
yanked = "deny"
ignore = [
    # pin-utils has no maintained release; it arrives only through hyper 1.8.1,
    # which the Codex release family pins on purpose.
    { id = "RUSTSEC-2026-0441", reason = "transitive via the pinned hyper 1.8.1; no patched release exists" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/openai-oss-forks/tokio-tungstenite",
    "https://github.com/openai-oss-forks/tungstenite-rs",
]
